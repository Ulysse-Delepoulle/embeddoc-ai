services:
  db:
    image: pgvector/pgvector:pg16
    container_name: embeddoc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embeddoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embeddoc}
      POSTGRES_DB: ${POSTGRES_DB:-embeddoc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-embeddoc} -d ${POSTGRES_DB:-embeddoc}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
